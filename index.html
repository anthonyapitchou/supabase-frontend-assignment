<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Article Hub</title>

  <link rel="stylesheet" href="./src/output.css">
</head>

<body class="min-h-screen bg-slate-950 text-slate-900">

  <!-- Header -->
  <header id="header"></header>


  <!-- Main -->
  <main>

    <!-- Hero -->
    <section class="relative overflow-hidden bg-slate-950">
      
      <div class="absolute -right-32 -top-32 h-96 w-96 rounded-full bg-blue-500/20 blur-3xl"></div>
      <div class="absolute -left-32 bottom-0 h-80 w-80 rounded-full bg-violet-500/20 blur-3xl"></div>

      <div class="relative mx-auto max-w-7xl px-6 py-20 lg:px-8 lg:py-28">

        <div class="max-w-3xl">

          <span class="inline-flex rounded-full border border-blue-400/30 bg-blue-400/10 px-4 py-2 text-sm font-medium text-blue-300">
            Community publishing
          </span>

          <h1 class="mt-6 text-5xl font-bold tracking-tight text-white sm:text-6xl lg:text-7xl">
            Ideas worth
            <span class="text-blue-400"> sharing.</span>
          </h1>

          <p class="mt-6 max-w-2xl text-lg leading-8 text-slate-400">
            Discover stories, ideas and perspectives from our community.
            Read something interesting or share your own.
          </p>

          <div class="mt-8 flex flex-wrap gap-4">

            <a  href="articles.html"
              class="rounded-xl bg-blue-500 px-6 py-3 font-semibold text-white shadow-lg shadow-blue-500/20 transition hover:bg-blue-400">
              Explore articles
            </a>

            <a
              href="create-post.html"
              class="rounded-xl border border-slate-700 bg-slate-900 px-6 py-3 font-semibold text-white transition hover:border-slate-500 hover:bg-slate-800">
              Write an article
            </a>

          </div>

        </div>

      </div>

    </section>


    <!-- Articles -->
   <section class="bg-slate-900">

      <div class="mx-auto max-w-7xl px-6 py-16 lg:px-8">

        <div class="mb-10 flex items-end justify-between">

          <div>
            <p class="text-sm font-semibold uppercase tracking-widest text-blue-600">
              Latest
            </p>

            <h2 class="mt-2 text-3xl font-bold tracking-tight text-slate-900">
              Community articles
            </h2>

            <p class="mt-2 text-slate-500">
              Fresh ideas from our writers.
            </p>
          </div>

        </div>


        <!-- Loading -->
        <div id="loading" class="py-12 text-center">
          <p class="text-sm text-slate-500">
            Loading articles...
          </p>
        </div>


        <!-- Articles generated by JavaScript -->
        <div
          id="articles-list"
          class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"
        >
        </div>

      </div>

    </section>

  </main>


  <!-- Footer -->
  <footer id="footer"></footer>


  <script type="module" src="./js/components.js"></script>
  <script type="module" src="./js/auth.js"></script>

</body>
</html>
