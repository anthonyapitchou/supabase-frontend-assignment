
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article | Community Articles</title>
  <link rel="stylesheet" href="./src/output.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-900">

  <header id="header"></header>

  <main class="bg-slate-900">
    <section class="mx-auto max-w-4xl px-6 py-16 lg:px-8">

      <a href="./articles.html"
         class="text-sm font-semibold text-blue-400 hover:text-blue-300">
        ← Back to articles
      </a>

      <div id="loading" class="py-12 text-center text-slate-400">
        Loading article...
      </div>

      <p id="error-message" class="hidden mt-8 text-red-400"></p>

      <article id="article-content" class="hidden mt-8">
        <p id="article-category"
           class="text-sm font-semibold uppercase tracking-widest text-blue-400"></p>

        <h1 id="article-title"
            class="mt-3 wrap-break-word text-3xl font-bold tracking-tight text-white sm:text-4xl"></h1>

        <p id="article-date" class="mt-4 text-sm text-slate-500"></p>

        <div id="article-body"
             class="mt-8 whitespace-pre-wrap wrap-break-word leading-8 text-slate-300"></div>
      </article>

    </section>
  </main>

  <footer id="footer"></footer>

  <script type="module" src="./js/components.js"></script>
  <script type="module" src="./js/article.js"></script>

</body>
</html>
