<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Article - Article Hub</title>

  <link rel="stylesheet" href="./src/output.css">
</head>

<body class="min-h-screen bg-slate-950 text-white">

  <header id="header"></header>

  <main class="mx-auto max-w-3xl px-6 py-16">

    <div class="mb-10">
      <p class="text-sm font-semibold uppercase tracking-widest text-blue-400">
        Community
      </p>

      <h1 class="mt-3 text-4xl font-bold tracking-tight">
        Create Article
      </h1>

      <p class="mt-3 text-slate-400">
        Share your ideas with the Article Hub community.
      </p>
    </div>


    <div class="rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-2xl">

      <form id="create-form" class="space-y-6">

        <div>
          <label for="title" class="text-sm font-medium text-slate-200">
            Title
          </label>

          <input
            type="text"
            id="title"
            name="title"
            required
            class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
            placeholder="Enter your article title"
          >
        </div>


        <div>
          <label for="content" class="text-sm font-medium text-slate-200">
            Content
          </label>

          <textarea
            id="content"
            name="content"
            required
            rows="8"
            class="mt-2 w-full resize-y rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
            placeholder="Write your article..."
          ></textarea>
        </div>


        <div>
          <label for="category" class="text-sm font-medium text-slate-200">
            Category
          </label>

          <input
            type="text"
            id="category"
            name="category"
            required
            class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
            placeholder="Technology, Design, Culture..."
          >
        </div>


        <div id="error-message" class="text-sm text-red-400"></div>


        <div id="loading" class="hidden text-center">
          <p class="text-sm text-blue-400">
            Creating article...
          </p>
        </div>


        <button
          type="submit"
          class="w-full rounded-xl bg-blue-500 px-5 py-3 font-semibold text-white shadow-lg shadow-blue-500/20 transition hover:bg-blue-400"
        >
          Create Article
        </button>

      </form>

    </div>

  </main>

  <footer id="footer"></footer>

  <script type="module" src="./js/components.js"></script>
  <script type="module" src="./js/post.js"></script>

</body>
</html>
