
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Articles</title>
  <link rel="stylesheet" href="./src/output.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-900">

  <header id="header"></header>

  <main>
    <section class="bg-slate-900">
      <div class="mx-auto max-w-7xl px-6 py-16 lg:px-8">

        <div class="mb-10">
          <p class="text-sm font-semibold uppercase tracking-widest text-blue-400">
            Latest
          </p>

          <h1 class="mt-2 text-3xl font-bold tracking-tight text-white">
            Community articles
          </h1>

          <p class="mt-2 text-slate-400">
            Fresh ideas from our writers.
          </p>
        </div>

        <div id="loading" class="py-12 text-center text-slate-400">
          Loading articles...
        </div>

        <div
          id="articles-list"
          class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"
        ></div>

      </div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script type="module" src="./js/components.js"></script>
  <script type="module" src="./js/auth.js"></script>

</body>
</html>
